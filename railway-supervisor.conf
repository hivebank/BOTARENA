[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/app/logs/nginx_stdout.log
stderr_logfile=/app/logs/nginx_stderr.log
priority=1

[program:php-fpm]
command=/usr/sbin/php-fpm8.1 -F
autostart=true
autorestart=true
stdout_logfile=/app/logs/php_fpm_stdout.log
stderr_logfile=/app/logs/php_fpm_stderr.log
priority=2

[program:bot_runner]
command=python3 /app/python/bot_runner.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/bot_runner_stdout.log
stderr_logfile=/app/logs/bot_runner_stderr.log
priority=3
environment=PYTHONUNBUFFERED="1"

[program:scheduler]
command=python3 /app/python/scheduler.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/scheduler_stdout.log
stderr_logfile=/app/logs/scheduler_stderr.log
priority=4
environment=PYTHONUNBUFFERED="1"

[group:python_workers]
programs=bot_runner,scheduler
priority=999

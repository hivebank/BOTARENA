server {
    listen 8080;
    server_name _;

    root /app/public;
    index index.php index.html;

    # Logging
    access_log /app/logs/nginx_access.log;
    error_log /app/logs/nginx_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size
    client_max_body_size 20M;

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API requests
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Pass environment variables to PHP
        fastcgi_param MONGO_URI $MONGO_URI if_not_empty;
        fastcgi_param JWT_SECRET $JWT_SECRET if_not_empty;
        fastcgi_param RAILWAY_ENVIRONMENT $RAILWAY_ENVIRONMENT if_not_empty;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ \.(env|json|md|sh|log)$ {
        deny all;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to config and python directories
    location ^~ /config/ {
        deny all;
    }

    location ^~ /python/ {
        deny all;
    }
}
